<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童謠開心門</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5c8374;
            --primary-light: #eaf1ed;
            --accent: #e09f3e;
            --bg: #f5f7f6;
            --card-bg: #ffffff;
            --text: #2b2b2b;
            --sidebar-width: 320px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif, 'Nunito';
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* 左側導航與樹狀下拉選單 */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card-bg);
            border-right: 1px solid #e0e5e2;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-shadow: 2px 0 10px rgba(0,0,0,0.02);
            z-index: 10;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background-color: #fafbfb;
        }
        .sidebar-header h2 {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .sidebar-header p {
            font-size: 0.85rem;
            color: #666;
        }
        .volume-list {
            overflow-y: auto;
            flex: 1;
            padding: 12px;
        }

        .volume-group {
            margin-bottom: 8px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #edf2ef;
            background: #fafbfb;
        }
        .volume-toggle {
            width: 100%;
            background: #f0f4f1;
            border: none;
            padding: 12px 16px;
            text-align: left;
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .volume-toggle:hover {
            background: #e5ede8;
        }
        .volume-toggle .arrow {
            transition: transform 0.3s ease;
            font-size: 0.8rem;
        }
        .volume-group.open .volume-toggle .arrow {
            transform: rotate(90deg);
        }

        .lesson-sublist {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
            background: white;
            padding: 0 8px;
        }
        .volume-group.open .lesson-sublist {
            max-height: 1500px;
            padding: 8px;
            overflow-y: auto;
        }
        .lesson-item {
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.2s, color 0.2s;
            font-size: 0.9rem;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lesson-item:hover {
            background-color: #f5f8f6;
            color: var(--primary);
        }
        .lesson-item.active {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
        }

        /* 右側主內容區 */
        .main-content {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px 40px;
        }
        .content-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid #e5ede8;
            width: 100%;
            max-width: none;
            margin: 0;
        }
        .lesson-title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f4f1;
            padding-bottom: 15px;
        }
        .lesson-title-area h1 {
            font-size: 1.5rem;
            color: var(--primary);
        }
        .badge {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .section-box {
            background: #fafbfb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #edf2ef;
        }
        .section-box h3 {
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 選擇冊別與選擇名稱設定區塊 */
        .meta-edit-grid {
            display: grid;
            grid-template-columns: 140px 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
            background: #ffffff;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #d5e2dc;
            align-items: center;
        }
        .meta-field label {
            display: block;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .meta-field select, .meta-field input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #b5c9be;
            border-radius: 6px;
            font-size: 0.9rem;
            background: #fff;
            color: var(--text);
            outline: none;
        }
        .meta-field select:focus, .meta-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(92, 131, 116, 0.15);
        }

        /* 上傳與媒體區塊控制 */
        .upload-panel {
            border: 2px dashed #b5c9be;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            background: #ffffff;
            margin-bottom: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .upload-panel:hover {
            background: #f0f5f2;
        }
        .upload-panel input[type="file"] {
            display: none;
        }
        .preview-img {
            max-width: 100%;
            max-height: 420px;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* 單一音軌按鈕樣式 */
        .track-btn {
            background-color: white;
            border: 1px solid #b5c9be;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 4px;
            transition: all 0.2s;
        }
        .track-btn:hover {
            background-color: var(--primary-light);
        }
        .track-btn.no-audio {
            opacity: 0.5;
            border-color: #d0dcd6;
            background-color: #f7f9f8;
        }
        .track-btn.no-audio:hover {
            opacity: 0.8;
        }

        /* 句子卡片排版 */
        .sentence-card {
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid #eaeef0;
        }
        .sentence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .sentence-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2c3e50;
        }
        .delete-sentence-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .delete-sentence-btn:hover {
            background: #c0392b;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .add-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .add-btn:hover { opacity: 0.9; }

        /* 資料重設按鈕區 */
        .reset-data-btn {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 5px;
        }
        .reset-data-btn:hover { background: #7f8c8d; }

        /* 登入與管理模式 */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(43, 43, 43, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .login-box {
            width: min(380px, calc(100vw - 32px));
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.18);
        }
        .login-box h2 {
            color: var(--primary);
            margin-bottom: 8px;
        }
        .login-box p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 18px;
        }
        .login-box label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 12px 0 5px;
            color: #555;
        }
        .login-box input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #b5c9be;
            border-radius: 7px;
            font-size: 0.95rem;
        }
        .login-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }
        .login-btn {
            flex: 1;
            border: none;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            font-weight: 700;
        }
        .login-btn.primary {
            background: var(--primary);
            color: white;
        }
        .login-btn.secondary {
            background: #eef3f0;
            color: var(--primary);
        }
        .login-error {
            color: #d64545;
            font-size: 0.82rem;
            min-height: 20px;
            margin-top: 8px;
        }
        .admin-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .admin-status {
            font-size: 0.82rem;
            color: var(--primary);
            background: var(--primary-light);
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: 600;
        }
        .logout-btn {
            border: 1px solid #cbd8d1;
            background: white;
            color: #555;
            border-radius: 7px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; height: auto; overflow: auto; }
            .sidebar { width: 100%; height: auto; max-height: 420px; }
            .main-content { height: auto; padding: 15px; }
            .meta-edit-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 登入視窗 -->
    <div class="login-overlay" id="loginOverlay" style="display:none;">
        <div class="login-box">
            <h2>🔐 管理員登入</h2>
            <p>登入後才能上傳圖片、音檔及修改童謠資料。</p>
            <label for="loginUsername">帳號</label>
            <input type="text" id="loginUsername" autocomplete="username" placeholder="請輸入管理員帳號">
            <label for="loginPassword">密碼</label>
            <input type="password" id="loginPassword" autocomplete="current-password" placeholder="請輸入管理員密碼">
            <div class="login-error" id="loginError"></div>
            <div class="login-actions">
                <button class="login-btn primary" onclick="loginAdmin()">登入</button>
                <button class="login-btn secondary" onclick="closeLogin()">取消</button>
            </div>
        </div>
    </div>

    <!-- 左側導航 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>童謠開心門</h2>
            <p>圖片與多音軌音檔管理</p>
        </div>
        <div class="volume-list" id="volumeList"></div>
    </div>

    <!-- 右側主內容區 -->
    <div class="main-content">
        <div class="content-card">

            <div class="admin-bar">
                <span class="admin-status" id="adminStatus">👤 瀏覽模式</span>
                <button class="login-btn primary" id="loginOpenBtn" style="flex:none;padding:6px 12px;" onclick="openLogin()">🔐 管理員登入</button>
                <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="logoutAdmin()">登出</button>
                <button class="reset-data-btn" id="resetDataBtn" style="display:none;" onclick="resetLocalStorageData()" title="清空本機儲存並恢復預設">🔄 重設資料</button>
            </div>
            <div class="lesson-title-area">
                <h1 id="currentTitle">載入中...</h1>
                <span class="badge" id="currentBadge">第一冊</span>
            </div>

            <!-- 整首圖片與多音軌區塊 -->
            <div class="section-box">
                <h3>🖼️ 童謠開心門圖片與多音軌音檔</h3>
                
                <!-- 選擇冊別、選擇童謠名稱與修改名稱設定區塊 -->
                <div class="meta-edit-grid">
                    <div class="meta-field">
                        <label>選擇冊別</label>
                        <select id="bookSelect" onchange="switchVolume(this.value)">
                            <option value="1">第一冊</option>
                            <option value="2">第二冊</option>
                            <option value="3">第三冊</option>
                        </select>
                    </div>
                    <div class="meta-field">
                        <label>選擇童謠名稱</label>
                        <select id="lessonSelect" onchange="switchLessonById(this.value)">
                            <!-- 動態填入該冊所有童謠 -->
                        </select>
                    </div>
                    <div class="meta-field">
                        <label>修改童謠標題名稱</label>
                        <input type="text" id="lessonTitleInput" oninput="updateLessonTitle(this.value)" placeholder="例: 1-1 求晴天外天...">
                    </div>
                </div>

                <div class="upload-panel" onclick="if (isAdmin) document.getElementById('songImageInput').click()">
                    <span>點擊此處上傳童謠開心門圖片</span>
                    <input type="file" id="songImageInput" accept="image/*" onchange="handleSongImageUpload(event)">
                    <div id="songImagePreviewContainer"></div>
                </div>

                <div style="font-size: 0.85rem; color: #555; margin-bottom: 6px; font-weight: 600;">整首音檔（點擊播放，若未上傳音檔則點擊可直接選擇檔案上傳）：</div>
                <div id="songTracksContainer" style="display: flex; flex-wrap: wrap; gap: 4px;"></div>
            </div>

            <!-- 新增句子區塊 -->
            <div class="section-box">
                <h3>📝 句子圖檔與多音軌音檔</h3>
                <div id="sentencesContainer"></div>
                <div class="action-bar">
                    <button class="add-btn" onclick="addNewSentence()">➕ 新增句子</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "1234";
    let isAdmin = false;

    function openLogin() {
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('loginUsername').focus();
        document.getElementById('loginError').innerText = '';
    }

    function closeLogin() {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('loginPassword').value = '';
    }

    function loginAdmin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
            isAdmin = true;
            closeLogin();
            updatePermissionUI();
            loadCurrentLesson();
        } else {
            document.getElementById('loginError').innerText = '帳號或密碼錯誤，請重新輸入。';
        }
    }

    function logoutAdmin() {
        isAdmin = false;
        updatePermissionUI();
        loadCurrentLesson();
    }

    function updateUploadUI() {
        const editGrid = document.querySelector('.meta-edit-grid');
        const songUploadPanel = document.querySelector('#songImageInput')?.closest('.upload-panel');
        const songUploadPrompt = songUploadPanel?.querySelector('span');
        const songUploadInput = document.getElementById('songImageInput');
        const songUploadLabel = document.querySelector('.section-box > div[style*="整首音檔"]');
        const addBtn = document.querySelector('.add-btn');

        if (editGrid) editGrid.style.display = isAdmin ? 'grid' : 'none';
        if (songUploadPanel) songUploadPanel.style.display = '';
        if (songUploadPrompt) songUploadPrompt.style.display = isAdmin ? '' : 'none';
        if (songUploadInput) songUploadInput.style.display = 'none';
        if (songUploadLabel) songUploadLabel.style.display = isAdmin ? '' : 'none';
        if (addBtn) addBtn.style.display = isAdmin ? '' : 'none';

        document.querySelectorAll('.sentence-card').forEach(card => {
            const sentenceUpload = card.querySelector('.upload-panel');
            const sentencePrompt = sentenceUpload?.querySelector('span');
            const sentenceInput = sentenceUpload?.querySelector('input[type="file"]');
            const deleteBtn = card.querySelector('.delete-sentence-btn');
            if (sentenceUpload) sentenceUpload.style.display = '';
            if (sentencePrompt) sentencePrompt.style.display = isAdmin ? '' : 'none';
            if (sentenceInput) sentenceInput.style.display = 'none';
            if (deleteBtn) deleteBtn.style.display = isAdmin ? '' : 'none';
        });
    }

    function updatePermissionUI() {
        const status = document.getElementById('adminStatus');
        const openBtn = document.getElementById('loginOpenBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const resetBtn = document.getElementById('resetDataBtn');

        if (isAdmin) {
            status.innerText = '🔓 管理模式';
            openBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-block';
            resetBtn.style.display = 'inline-block';
        } else {
            status.innerText = '👤 瀏覽模式';
            openBtn.style.display = 'inline-block';
            logoutBtn.style.display = 'none';
            resetBtn.style.display = 'none';
        }

        document.getElementById('lessonTitleInput').disabled = !isAdmin;
        document.getElementById('bookSelect').disabled = !isAdmin;
        document.getElementById('songImageInput').disabled = !isAdmin;
        document.querySelector('.add-btn').style.display = isAdmin ? '' : 'none';

        document.querySelectorAll('.upload-panel').forEach(panel => {
            panel.style.cursor = isAdmin ? 'pointer' : 'default';
        });

        updateUploadUI();
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && document.getElementById('loginOverlay').style.display === 'flex') {
            loginAdmin();
        }
        if (e.key === 'Escape' && document.getElementById('loginOverlay').style.display === 'flex') {
            closeLogin();
        }
    });

    // 預設資料結構
    function getDefaultVolumesData() {
        return [
            {
                volumeId: 1,
                volumeTitle: "第一冊",
                lessons: [
                    { id: 1, title: "1-1 求晴天外天｜Rain, rain, go away", songImage: "", songAudios: { '博士': '', '大蒨': '', '慢速': '', '分解': '', '翻譯': '', '語調': '', '100LS': '', '20LS': '' }, sentences: [{ textForAudio: "Rain, rain, go away.", image: "", audios: { '博士': '', '大蒨': '', '慢速': '', '分解': '', '翻譯': '', '語調': '', '100LS': '', '20LS': '' } }] },
                    { id: 2, title: "1-2 仰問星星間｜Twinkle, twinkle, little star", songImage: "", songAudios: { '博士': '', '大蒨': '', '慢速': '', '分解': '', '翻譯': '', '語調': '', '100LS': '', '20LS': '' }, sentences: [] },
                    { id: 3, title: "1-3 萬物皆入詩｜Roses are red", songImage: "", songAudios: { '博士': '', '大蒨': '', '慢速': '', '分解': '', '翻譯': '', '語調': '', '100LS': '', '20LS': '' }, sentences: [] },
                    { id: 4, title: "1-4 抱願入好眠｜Star light star bright", songImage: "", songAudios: { '博士': '', '大蒨': '', '慢速': '', '分解': '', '翻譯': '', '語調': '', '100LS': '', '20LS': '' }, sentences: [] },
                    { id: 5, title: "1-5 聽說聽話好｜Teddy bear, teddy bear, turn around", songImage: "", songAudios: { '博士': '', '大蒨': '', '慢速': '', '分解': '', '翻譯': '', '語調': '', '100LS': '', '20LS': '' }, sentences: [] },
                    { id: 6, title: "1-6 劣鎖靠良鑰｜I'm gold lock; I'm gold key", songImage: "", songAudios: { '博士': '', '大蒨': '', '慢速': '', '分解': '', '翻譯': '', '語調': '', '100LS': '', '20LS': '' }, sentences: [] },
                    { id: 7, title: "1-7 騎牆才怕跌｜Humpty Dumpty sat on a wall", songImage: "", songAudios: { '博士': '', '大蒨': '', '慢速': '', '分解': '', '翻譯': '', '語調': '', '100LS': '', '20LS': '' }, sentences: [] },
                    { id: 8, title: "1-8 人熟蟲不咬｜Good night; sleep tight", songImage: "", songAudios: { '博士': '', '大蒨': '', '慢速': '', '分解': '', '翻譯': '', '語調': '', '100LS': '', '20LS': '' }, sentences: [] },

    // 初始化與 localStorage 讀取
    const STORAGE_KEY = 'nursery_rhymes_volumes_data_v2';
    let volumesData = [];

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                volumesData = JSON.parse(saved);
            } catch (e) {
                console.error("解析 LocalStorage 失敗，改用預設資料", e);
                volumesData = getDefaultVolumesData();
            }
        } else {
            volumesData = getDefaultVolumesData();
        }
    }

    function saveData() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(volumesData));
        } catch (e) {
            console.error("LocalStorage 儲存失敗", e);
            alert("儲存失敗：可能是上傳的圖片或音檔總容量過大，超過瀏覽器限制（通常約 5MB）。建議壓縮圖片或使用較短的音檔。");
        }
    }

    function resetLocalStorageData() {
        if (confirm("確定要重設所有自訂資料並恢復預設狀態嗎？這將清除所有已上傳的圖片與音檔。")) {
            localStorage.removeItem(STORAGE_KEY);
            loadData();
            currentActiveLessonId = 1;
            openVolumeId = 1;
            renderSidebar();
            loadCurrentLesson();
            alert("已成功重設為預設資料！");
        }
    }

    let currentActiveLessonId = 1;
    let openVolumeId = 1;

    const volumeListEl = document.getElementById('volumeList');

    function renderSidebar() {
        volumeListEl.innerHTML = '';
        volumesData.forEach(vol => {
            const isOpen = vol.volumeId === openVolumeId;
            const groupDiv = document.createElement('div');
            groupDiv.className = `volume-group ${isOpen ? 'open' : ''}`;

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'volume-toggle';
            toggleBtn.innerHTML = `<span>${vol.volumeTitle}</span><span class="arrow">▶</span>`;
            toggleBtn.onclick = () => {
                openVolumeId = openVolumeId === vol.volumeId ? null : vol.volumeId;
                renderSidebar();
            };
            groupDiv.appendChild(toggleBtn);

            const sublistDiv = document.createElement('div');
            sublistDiv.className = 'lesson-sublist';

            vol.lessons.forEach(lesson => {
                const item = document.createElement('div');
                item.className = `lesson-item ${lesson.id === currentActiveLessonId ? 'active' : ''}`;
                item.innerHTML = `<span>${lesson.title}</span>`;
                item.onclick = (e) => {
                    e.stopPropagation();
                    currentActiveLessonId = lesson.id;
                    openVolumeId = vol.volumeId;
                    loadCurrentLesson();
                    renderSidebar();
                };
                sublistDiv.appendChild(item);
            });

            groupDiv.appendChild(sublistDiv);
            volumeListEl.appendChild(groupDiv);
        });
    }

    function getCurrentLessonInfo() {
        for (let vol of volumesData) {
            for (let lesson of vol.lessons) {
                if (lesson.id === currentActiveLessonId) {
                    return { lesson, volumeId: vol.volumeId, volumeTitle: vol.volumeTitle, volumeObj: vol };
                }
            }
        }
        return { lesson: volumesData[0].lessons[0], volumeId: 1, volumeTitle: "第一冊", volumeObj: volumesData[0] };
    }

    function updateLessonDropdownOptions(currentVolObj, selectedLessonId) {
        const lessonSelect = document.getElementById('lessonSelect');
        lessonSelect.innerHTML = '';
        currentVolObj.lessons.forEach(l => {
            const opt = document.createElement('option');
            opt.value = l.id;
            opt.textContent = l.title;
            if (l.id === selectedLessonId) {
                opt.selected = true;
            }
            lessonSelect.appendChild(opt);
        });
    }

    function switchLessonById(lessonId) {
        currentActiveLessonId = parseInt(lessonId);
        loadCurrentLesson();
        renderSidebar();
    }

    function loadCurrentLesson() {
        const { lesson, volumeId, volumeTitle, volumeObj } = getCurrentLessonInfo();
        
        document.getElementById('currentTitle').innerText = lesson.title;
        document.getElementById('currentBadge').innerText = volumeTitle;

        document.getElementById('bookSelect').value = volumeId;
        updateLessonDropdownOptions(volumeObj, lesson.id);
        document.getElementById('lessonTitleInput').value = lesson.title;

        const songPreviewContainer = document.getElementById('songImagePreviewContainer');
        songPreviewContainer.innerHTML = lesson.songImage ? `<img src="${lesson.songImage}" class="preview-img">` : '<span style="font-size:0.8rem; color:#888;">(尚未上傳童謠開心門圖片)</span>';

        renderSongTracks();
        renderSentences();
        updateUploadUI();
    }

    function switchVolume(newVolumeId) {
        newVolumeId = parseInt(newVolumeId);
        const targetVol = volumesData.find(v => v.volumeId === newVolumeId);
        if (!targetVol || !targetVol.lessons.length) return;

        currentActiveLessonId = targetVol.lessons[0].id;
        openVolumeId = newVolumeId;
        loadCurrentLesson();
        renderSidebar();
    }

    function updateLessonTitle(newTitle) {
        if (!isAdmin) {
            loadCurrentLesson();
            return;
        }
        const { lesson } = getCurrentLessonInfo();
        lesson.title = newTitle;
        document.getElementById('currentTitle').innerText = lesson.title;
        const { volumeObj } = getCurrentLessonInfo();
        updateLessonDropdownOptions(volumeObj, lesson.id);
        renderSidebar();
        saveData();
    }

    function handleSongImageUpload(event) {
        if (!isAdmin) return;
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const { lesson } = getCurrentLessonInfo();
                lesson.songImage = e.target.result;
                loadCurrentLesson();
                saveData();
            };
            reader.readAsDataURL(file);
        }
    }

    function renderSongTracks() {
        const { lesson } = getCurrentLessonInfo();
        const container = document.getElementById('songTracksContainer');

        const tracks = [
            { name: '博士', icon: '👨‍🏫' },
            { name: '大蒨', icon: '👩‍🎓' },
            { name: '慢速', icon: '🐢' },
            { name: '分解', icon: '⚙️' },
            { name: '翻譯', icon: '🌐' },
            { name: '語調', icon: '📈' },
            { name: '100LS', icon: '🎧' },
            { name: '20LS', icon: '🎙️' }
        ];

        container.innerHTML = '';
        tracks.forEach(t => {
            const hasAudio = Boolean(lesson.songAudios[t.name]);
            const btn = document.createElement('button');
            btn.className = `track-btn ${hasAudio ? '' : 'no-audio'}`;
            btn.innerHTML = `${t.icon} ${t.name}`;
            btn.title = hasAudio ? `播放 ${t.name}` : `上傳 ${t.name} 音檔`;

            const hiddenInput = document.createElement('input');
            hiddenInput.type = 'file';
            hiddenInput.accept = 'audio/*';
            hiddenInput.style.display = 'none';
            hiddenInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(uploadEvent) {
                        lesson.songAudios[t.name] = uploadEvent.target.result;
                        renderSongTracks();
                        saveData();
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            };

            btn.onclick = () => {
                if (hasAudio) {
                    playAudio(lesson.songAudios[t.name], lesson.title, t.name);
                } else if (isAdmin) {
                    hiddenInput.click();
                }
            };
            
            btn.oncontextmenu = (e) => {
                e.preventDefault();
                hiddenInput.click();
            };

            container.appendChild(btn);
            container.appendChild(hiddenInput);
        });
    }

    function renderSentences() {
        const container = document.getElementById('sentencesContainer');
        container.innerHTML = '';
        const { lesson } = getCurrentLessonInfo();

        lesson.sentences.forEach((s, idx) => {
            const tracks = [
                { name: '博士', icon: '👨‍🏫' },
                { name: '大蒨', icon: '👩‍🎓' },
                { name: '慢速', icon: '🐢' },
                { name: '分解', icon: '⚙️' },
                { name: '翻譯', icon: '🌐' },
                { name: '語調', icon: '📈' },
                { name: '100LS', icon: '🎧' },
                { name: '20LS', icon: '🎙️' }
            ];

            let tracksHtml = '';
            tracks.forEach(t => {
                const hasAudio = Boolean(s.audios[t.name]);
                tracksHtml += `
                    <button class="track-btn ${hasAudio ? '' : 'no-audio'}" title="${hasAudio ? '點擊播放' : '點擊上傳音檔'}" onclick="handleSentenceClick(${idx}, '${t.name}', '${s.textForAudio.replace(/'/g, "\'")}')" oncontextmenu="event.preventDefault(); document.getElementById('sentence_audio_${idx}_${t.name}').click()">
                        ${t.icon} ${t.name}
                    </button>
                    <input type="file" id="sentence_audio_${idx}_${t.name}" accept="audio/*" style="display: none;" onchange="handleSentenceUpload(event, ${idx}, '${t.name}')">
                `;
            });

            const card = document.createElement('div');
            card.className = 'sentence-card';
            card.innerHTML = `
                <div class="sentence-header">
                    <div class="sentence-title">句子 ${idx + 1}</div>
                    <button class="delete-sentence-btn" style="display:${isAdmin ? '' : 'none'}" onclick="deleteSentence(${idx})">🗑️ 刪除此句</button>
                </div>
                <div class="upload-panel" onclick="if (isAdmin) document.getElementById('sentenceImageInput_${idx}').click()" style="padding: 10px; margin-bottom: 10px;">
                    <span style="font-size:0.85rem;">點擊上傳本句圖片</span>
                    <input type="file" id="sentenceImageInput_${idx}" accept="image/*" ${isAdmin ? '' : 'disabled'} onchange="handleSentenceImageUpload(event, ${idx})">
                    ${s.image ? `<img src="${s.image}" class="preview-img" style="max-height: 300px;">` : '<div style="font-size:0.75rem; color:#888;">(無圖片)</div>'}
                </div>
                <div style="font-size: 0.85rem; color: #555; margin-top: 6px; font-weight: 600;">本句音檔（點擊播放，未上傳時點擊可直接上傳）：</div>
                <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;">
                    ${tracksHtml}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function handleSentenceClick(sentenceIndex, trackName, fallbackText) {
        const { lesson } = getCurrentLessonInfo();
        const audioUrl = lesson.sentences[sentenceIndex].audios[trackName];
        if (audioUrl) {
            playAudio(audioUrl, fallbackText, trackName);
        } else if (isAdmin) {
            document.getElementById(`sentence_audio_${sentenceIndex}_${trackName}`).click();
        }
    }

    function handleSentenceUpload(event, sentenceIndex, trackName) {
        if (!isAdmin) return;
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const { lesson } = getCurrentLessonInfo();
                lesson.sentences[sentenceIndex].audios[trackName] = uploadEvent.target.result;
                renderSentences();
                saveData();
            };
            reader.readAsDataURL(file);
        }
        event.target.value = '';
    }

    function handleSentenceImageUpload(event, index) {
        if (!isAdmin) return;
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const { lesson } = getCurrentLessonInfo();
                lesson.sentences[index].image = e.target.result;
                loadCurrentLesson();
                saveData();
            };
            reader.readAsDataURL(file);
        }
    }

    function addNewSentence() {
        if (!isAdmin) return;
        const { lesson } = getCurrentLessonInfo();
        lesson.sentences.push({
            textForAudio: "New sentence practice.",
            image: "",
            audios: { '博士': '', '大蒨': '', '慢速': '', '分解': '', '翻譯': '', '語調': '', '100LS': '', '20LS': '' }
        });
        loadCurrentLesson();
        saveData();
    }

    function deleteSentence(index) {
        if (!isAdmin) return;
        if (confirm("確定要刪除這句嗎？")) {
            const { lesson } = getCurrentLessonInfo();
            lesson.sentences.splice(index, 1);
            loadCurrentLesson();
            saveData();
        }
    }

    function playAudio(audioUrl, fallbackText, trackName) {
        if (audioUrl) {
            const audio = new Audio(audioUrl);
            audio.play().catch(e => console.log(e));
        } else {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(fallbackText);
                utterance.lang = trackName === '翻譯' ? 'zh-TW' : 'en-US';
                if (trackName === '慢速') utterance.rate = 0.6;
                else if (trackName === '分解') utterance.rate = 0.5;
                else utterance.rate = 0.9;
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的瀏覽器不支援語音播放。');
            }
        }
    }

    // 初始化執行
    loadData();
    renderSidebar();
    loadCurrentLesson();
    updatePermissionUI();
</script>
